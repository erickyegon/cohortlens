target-version = "py312"
line-length = 120
extend-exclude = ["web", "data/seed"]

[lint]
select = ["E", "F", "I", "B", "UP", "S608"]  # S608: flag SQL built from strings (AGENTS.md rule 1)
ignore = []

[lint.per-file-ignores]
# narrow, file-level only (reviewed): these build SQL text from constants, never from user input
"api/tests/integration/test_truth_fixture.py" = ["S608"]  # f-strings only hard-coded ints and CTE names
"api/tests/integration/test_seed_example_cohort.py" = ["S608"]  # f-string over a fixed tuple of table names
"data/etl/synthea_to_omop.py" = ["S608", "E501"]  # DuckDB SQL from fixed table names and file paths; long SQL strings
# the generator emits SQL text with printf-style templates on purpose
"api/tests/fixtures/build_truth_fixture.py" = ["UP031", "E501", "S608"]  # emits INSERT text for a static fixture, no input
