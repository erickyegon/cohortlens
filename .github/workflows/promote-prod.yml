name: Promote to prod

# The run name carries the commit being promoted and what the dev deploy was for, so a stale run is recognisable in the
# list of runs and on the approval page.
run-name: "Promote to prod: ${{ github.event.workflow_run.head_sha || inputs.version || 'what dev serves now' }} (${{ github.event.workflow_run.display_title || 'by hand' }})"

# After a successful dev deploy (or by hand), this promotes what dev is serving to production. The job runs in the
# `production` environment, so it PAUSES until the environment's required reviewer approves it in GitHub; only then does
# it authenticate as the prod deploy account (which only jobs of that environment can impersonate, see setup.sh).
# infra/gcp/promote.sh builds nothing: it reads the digest-pinned images dev is serving and infra/gcp/deploy.sh deploys
# those same digests to prod as a no-traffic candidate, smoke tests its tagged URL, and only then moves traffic.
#
# Needs (once): the Google Cloud setup and the repository variables it prints (docs/deployment.md). Until
# GCP_PROJECT_ID is set the job is skipped.

on:
  workflow_run:
    workflows: ["Deploy dev"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Full 40-character commit sha you expect dev to be serving (leave empty to promote whatever dev serves now)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write  # workload identity federation: no key files

jobs:
  # A run that waits for approval holds a workflow-level concurrency group, so a newer run would queue behind it and a
  # stale promotion could stay approvable for hours (audit section 13). So the group is on the deploying job only, and
  # this job of every NEW run first cancels the older runs that are still waiting for approval. A run that is already
  # deploying is not touched (only runs seen waiting at that moment are cancelled). It has no environment, no cloud credentials and no id-token.
  supersede:
    name: cancel stale promotions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: write  # to cancel a run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # the script needs no git credentials and the token can write
      - run: bash infra/gcp/cancel_stale_promotions.sh

  promote:
    name: promote to prod
    needs: supersede
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: promote-prod
      cancel-in-progress: false  # never cut a production deploy off half way
    # only on main, only after a dev deploy that succeeded (or by hand), and not until the setup variables exist
    if: >-
      github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA_PROD }}
      OTLP_ENDPOINT: ${{ vars.GCP_OTLP_ENDPOINT }}  # optional: Grafana Cloud OTLP endpoint (docs/observability.md)
      # untrusted text goes through the environment and is validated by promote.sh, never into the shell inline
      EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha || inputs.version }}
    steps:
      # the scripts come from the tip of main on purpose (the newest, reviewed version of the promotion logic); WHAT is
      # promoted is decided by the digests dev serves and the commit the approver was shown, not by this checkout
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Promote what dev is serving (same digests), candidate first, then traffic
        run: |
          if [ -n "$EXPECTED_VERSION" ]; then
            bash infra/gcp/promote.sh --expect-version "$EXPECTED_VERSION"
          else
            bash infra/gcp/promote.sh
          fi
