name: cohortlens

# The password defaults below are LOCAL-ONLY placeholders so that `docker compose up --build` works from a clean
# clone. Cloud environments take real credentials from secrets; override locally in .env if you like.

x-db-env: &db-env
  DATABASE_URL_READER: postgresql://cohortlens_reader:${COHORTLENS_READER_PASSWORD:-reader_local}@db:5432/cohortlens
  DATABASE_URL_APP: postgresql://cohortlens_app:${COHORTLENS_APP_PASSWORD:-app_local}@db:5432/cohortlens

services:
  db:
    image: postgres:18  # the same major version as the Neon project (docs/deployment.md)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cohortlens_local}
      POSTGRES_DB: cohortlens
      COHORTLENS_READER_PASSWORD: ${COHORTLENS_READER_PASSWORD:-reader_local}
      COHORTLENS_APP_PASSWORD: ${COHORTLENS_APP_PASSWORD:-app_local}
    volumes:
      # Postgres 18+ images keep the data in /var/lib/postgresql/<major>/docker, so the volume is mounted one level up
      - pgdata:/var/lib/postgresql
      # run once, in name order, on first start of an empty data directory
      - ./db/init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./data/seed/omop_subset.sql.gz:/docker-entrypoint-initdb.d/10-omop_subset.sql.gz:ro
      - ./db/init/20-grants.sql:/docker-entrypoint-initdb.d/20-grants.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cohortlens && psql -h 127.0.0.1 -U postgres -d cohortlens -tAc \"select 1 from cdm.person limit 1\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  migrate:
    build:
      context: ./api
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-dev}
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-dev}
    environment: *db-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
    environment:
      API_UPSTREAM: http://api:8000
      API_HOST: api:8000
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
